[package]
name = "logview"
version = "0.1.0"
edition = "2021"
description = "A modern lnav — multi-file structured log tailing/filtering TUI"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/logview"
readme = "README.md"
keywords = ["logs", "tui", "lnav", "tail", "log-viewer"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "logview"
path = "src/lib.rs"

[[bin]]
name = "logview"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde_json = "1"
chrono = "0.4"
regex = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
